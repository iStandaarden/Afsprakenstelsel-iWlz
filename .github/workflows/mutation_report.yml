name: Mutatieoverzicht bij release afsprakenstelsel iWlz

# Alleen handmatig: Releases -> "Draft a new release" -> "Publish release".
# Een opgeslagen concept (draft) start de workflow niet, pas bij publiceren.
# het genereerd mutatieoverzicht wordt toegevoegd aan de releasebeschrijving.
on:
  release:
    types: [published]

permissions:
  contents: write   # nodig om de releasebeschrijving bij te werken

jobs:
  mutatieoverzicht:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volledige historie + tags nodig voor de diff

      - name: Bepaal te vergelijken commits
        id: range
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Vorige tag = dichtstbijzijnde tag in de historie van de nieuwe tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          BASE_REF="${PREV_TAG:-$(git hash-object -t tree /dev/null)}"

          {
            echo "prev=$PREV_TAG"
            echo "base=$BASE_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Detect changed directories
        id: changes
        env:
          BASE_REF: ${{ steps.range.outputs.base }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$BASE_REF" "$TAG")

          # directory-prefix match
          check_dir() {
            local dir="$1"
            if echo "$CHANGED_FILES" | grep -q "^$dir"; then
              echo "yes"
            else
              echo "no"
            fi
          }

          # exact file match instead of directory prefix
          check_file() {
            local file="$1"
            if echo "$CHANGED_FILES" | grep -qxF "$file"; then
              echo "yes"
            else
              echo "no"
            fi
          }

          # Specific directory output
          echo "welkom=$(check_dir 'docs/welkom/')" >> "$GITHUB_OUTPUT"
          # Specific file output
          echo "achtergrond_toelichting=$(check_file 'inleiding/achtergrond_toelichting.md')" >> "$GITHUB_OUTPUT"
          echo "governance=$(check_file 'inleiding/governance.md')" >> "$GITHUB_OUTPUT" 
          echo "begrippenlijst=$(check_file 'inleiding/begrippenlijst.md')" >>  "$GITHUB_OUTPUT"
          echo "randvoorwaarden=$(check_file 'organisatiebeleid/randvoorwaarden.md')" >> "$GITHUB_OUTPUT"
          echo "ontwerpkeuzes=$(check_file 'organisatiebeleid/ontwerpkeuzes.md')" >> "$GITHUB_OUTPUT"
          echo "architectuur=$(check_file 'organisatiebeleid/architectuur.md')" >> "$GITHUB_OUTPUT"
          echo "rollen_deelnemers=$(check_file 'organisatiebeleid/rollen_deelnemers.md')" >> "$GITHUB_OUTPUT"
          echo "serviceafspraken_iWlz_netwerkmodel=$(check_file 'organisatiebeleid/serviceafspraken/iwlz_netwerkmodel.md')" >> "$GITHUB_OUTPUT"
          echo "serviceafspraken_operationeel_netwerkbeheer=$(check_file 'organisatiebeleid/serviceafspraken/operationeel_netwerkbeheer.md')" >> "$GITHUB_OUTPUT"
          echo "serviceafspraken_bronhoudersdeel=$(check_file 'organisatiebeleid/serviceafspraken/bronhoudersdeel.md')" >> "$GITHUB_OUTPUT"
          echo "serviceafspraken_afnemersdeel=$(check_file 'organisatiebeleid/serviceafspraken/afnemersdeel.md')" >> "$GITHUB_OUTPUT"
          echo "releasebeleid=$(check_file 'organisatiebeleid/releasebeleid.md')" >> "$GITHUB_OUTPUT"
          echo "wijzigingsverzoeken=$(check_file 'organisatiebeleid/wijzigingsverzoeken.md')" >> "$GITHUB_OUTPUT"
          echo "netwerkfuncties=$(check_file 'proces/netwerkfuncties.md')" >> "$GITHUB_OUTPUT"
          echo "procesmodel=$(check_file 'proces/procesmodel.md')" >> "$GITHUB_OUTPUT"
          echo "informatiestandaard=$(check_file 'informatie/informatiestandaard.md')" >> "$GITHUB_OUTPUT"
          echo "applicatie_index=$(check_file 'applicatie/index.md')" >> "$GITHUB_OUTPUT"
          echo "applicatiecomponenten=$(check_file 'applicatie/applicatiecomponenten.md')" >> "$GITHUB_OUTPUT"
          echo "nid_netwerkstelsel=$(check_file 'applicatie/nid_netwerkstelsel.md')" >> "$GITHUB_OUTPUT"
          echo "graphql_over_http=$(check_file 'applicatie/graphql_over_http.md')" >> "$GITHUB_OUTPUT"
          echo "silvester=$(check_file 'applicatie/silvester.md')" >> "$GITHUB_OUTPUT"
          echo "notificeren_en_melden=$(check_file 'applicatie/diensten/notificeren-en-melden.md')" >> "$GITHUB_OUTPUT"
          echo "raadplegen=$(check_file 'applicatie/diensten/raadplegen.md')" >> "$GITHUB_OUTPUT"
          echo "toetreden=$(check_file 'applicatie/diensten/toetreden.md')" >> "$GITHUB_OUTPUT"
          echo "uittreden=$(check_file 'applicatie/diensten/uittreden.md')" >> "$GITHUB_OUTPUT"
          echo "testen=$(check_file 'applicatie/diensten/testen.md')" >> "$GITHUB_OUTPUT"
          echo "identificatie_authenticatie=$(check_file 'it-infrastructuur/identificatie_authenticatie.md')" >> "$GITHUB_OUTPUT"
          echo "netwerk=$(check_file 'it-infrastructuur/netwerk.md')" >> "$GITHUB_OUTPUT"
          echo "logging=$(check_file 'it-infrastructuur/logging.md')" >> "$GITHUB_OUTPUT"
          echo "uitwisselprofiel_index=$(check_file 'uitwisselprofiel/index.md')" >> "$GITHUB_OUTPUT"
          echo "uitwisselprofiel_indicatie=$(check_file 'uitwisselprofiel/uitwisselprofiel_indicatie.md')" >> "$GITHUB_OUTPUT"
          echo "uitwisselprofiel_bemiddeling=$(check_file 'uitwisselprofiel/uitwisselprofiel_bemiddeling.md')" >> "$GITHUB_OUTPUT"
          echo "uitwisselprofiel_levering=$(check_file 'uitwisselprofiel/uitwisselprofiel_levering.md')" >> "$GITHUB_OUTPUT"


      - name: Bouw release-tekst
        env:
          PREV_TAG: ${{ steps.range.outputs.prev }}
          # Wat je zelf in het beschrijvingsveld hebt gezet (bijv. via
          # "Generate release notes") blijft behouden onder het overzicht.
          EXISTING_BODY: ${{ github.event.release.body }}
        run: |
          {
            echo "Automatisch gegenereerd mutatieoverzicht van het afsprakenstelsel iWlz."
            if [ -n "$PREV_TAG" ]; then
              echo "Wijzigingen ten opzichte van \`${PREV_TAG}\`."
            else
              echo "Er is geen eerdere tag gevonden; er is vergeleken met een lege repository."
            fi
            echo
          } > release-body.md

          cat >> release-body.md <<'EOF'
          **Release bevat de volgende wijzigingen in de volgende onderdelen:**
          | Onderdeel | Wijziging |
          |-----------|-----------|
          | Welkom: | ${{ steps.changes.outputs.welkom }} |
          | Inleiding:| |
          | Achtergrond en toelichting (in inleiding/achtergrond en toelichting): | ${{ steps.changes.outputs.achtergrond_toelichting }} |
          | Governance (in inleiding/governance): | ${{ steps.changes.outputs.governance }} |
          | Begrippenlijst (in inleiding/begrippenlijst): | ${{ steps.changes.outputs.begrippenlijst }} |
          | Randvoorwaarden (in organisatie/randvoorwaarden): | ${{ steps.changes.outputs.randvoorwaarden }} |
          | Ontwerpkeuzes (in organisatie/ontwerpkeuzes): | ${{ steps.changes.outputs.ontwerpkeuzes }} |
          | Architectuur (in organisatie/architectuur): | ${{ steps.changes.outputs.architectuur }} |
          | Rollen en deelnemers (in organisatie/rollen en deelnemers): | ${{ steps.changes.outputs.rollen_deelnemers }} |
          | Serviceafspraken - iWlz netwerkmodel (in organisatie/serviceafspraken/iWlz netwerkmodel): | ${{ steps.changes.outputs.serviceafspraken_iWlz_netwerkmodel }} |
          | Serviceafspraken - Operationeel netwerkbeheer (in organisatie/serviceafspraken/operationeel netwerkbeheer): | ${{ steps.changes.outputs.serviceafspraken_operationeel_netwerkbeheer }} |
          | Serviceafspraken - Bronhoudersdeel (in organisatie/serviceafspraken/bronhoudersdeel): | ${{ steps.changes.outputs.serviceafspraken_bronhoudersdeel }} |
          | Serviceafspraken - Afnemersdeel (in organisatie/serviceafspraken/afnemersdeel): | ${{ steps.changes.outputs.serviceafspraken_afnemersdeel }} |
          | Releasebeleid (in organisatie/releasebeleid): | ${{ steps.changes.outputs.releasebeleid }} |
          | Wijzigingsverzoeken (in organisatie/wijzigingsverzoeken): | ${{ steps.changes.outputs.wijzigingsverzoeken }} |
          | Netwerkfuncties (proces/netwerkfuncties): | ${{ steps.changes.outputs.netwerkfuncties }} |
          | Procesmodel (proces/procesmodel): | ${{ steps.changes.outputs.procesmodel }} |
          | Informatiestandaard (in informatie/informatiestandaard): | ${{ steps.changes.outputs.informatiestandaard }} |
          | Applicatiecomponenten (in applicatie/applicatiecomponenten): | ${{ steps.changes.outputs.applicatiecomponenten }} |
          | nID netwerkstelsel (in applicatie/nid netwerkstelsel): | ${{ steps.changes.outputs.nid_netwerkstelsel }} |
          | GraphQL over HTTP (in applicatie/graphql over http): | ${{ steps.changes.outputs.graphql_over_http }} |
          | Silvester - Tijdelijke voorziening overgangsfase (in applicatie/silvester): | ${{ steps.changes.outputs.silvester }} |
          | Notificeren en Melden (in applicatie/diensten/notificeren en melden): | ${{ steps.changes.outputs.notificeren_en_melden }} |
          | Raadplegen (in applicatie/diensten/raadplegen): | ${{ steps.changes.outputs.raadplegen }} |
          | Toetreden (in applicatie/diensten/toetreden): | ${{ steps.changes.outputs.toetreden }} |
          | Uittreden (in applicatie/diensten/uittreden): | ${{ steps.changes.outputs.uittreden }} |
          | Testen (in applicatie/diensten/testen): | ${{ steps.changes.outputs.testen }} |
          | Identificatie & authenticatie (in it-infrastructuur/identificatie en authenticatie): | ${{ steps.changes.outputs.identificatie_authenticatie }} |
          | Netwerk (in it-infrastructuur/netwerk): | ${{ steps.changes.outputs.netwerk }} |
          | Logging (in it-infrastructuur/logging): | ${{ steps.changes.outputs.logging }} |
          | Uitwisselprofiel (in uitwisselprofiel): | ${{ steps.changes.outputs.uitwisselprofiel_index }} |
          | Uitwisselprofiel Indicatie (in uitwisselprofiel/uitwisselprofiel Indicatie): | ${{ steps.changes.outputs.uitwisselprofiel_indicatie }} |
          | Uitwisselprofiel Bemiddeling (in uitwisselprofiel/uitwisselprofiel Bemiddeling): | ${{ steps.changes.outputs.uitwisselprofiel_bemiddeling }} |
          | Uitwisselprofiel Levering (in uitwisselprofiel/uitwisselprofiel Levering): | ${{ steps.changes.outputs.uitwisselprofiel_levering }} |

          Voor meer informatie over de wijzigingen, zie hieronder.
          EOF

          if [ -n "$EXISTING_BODY" ]; then
            printf '\n---\n\n%s\n' "$EXISTING_BODY" >> release-body.md
          fi

      - name: Update releasebeschrijving
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --notes-file release-body.md