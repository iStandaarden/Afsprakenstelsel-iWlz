      - Informatiestandaard: informatie/informatiestandaard.md
  - Applicatie:
      - applicatie/index.md
      - Applicatiecomponenten: applicatie/applicatiecomponenten.md
      - nID netwerkstelsel: applicatie/nid_netwerkstelsel.md
