# Site information
site_name: Afsprakenstelsel iWlz Netwerkmodel
site_url: https://istandaarden.github.io/Afsprakenstelsel-iWlz/

# Repository information
repo_url: https://github.com/iStandaarden/Afsprakenstelsel-iWlz
repo_name: iStandaarden/Afsprakenstelsel-iWlz

# Theme configuration
theme:
  name: material
  language: nl
  icon:
    repo: fontawesome/brands/github
    logo: material/file-sign
  favicon: assets/file-sign-custom.png
  custom_dir: docs/overrides
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: custom
      accent: deep orange
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
      primary: custom
      accent: deep purple
  features:
    - navigation.top
    # - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
    # - toc.integrate

# plugins
plugins:
  - search
  - glightbox
  - with-pdf:
      enabled_if_env: ENABLED_PDF_EXPORT
      cover_title: Afsprakenstelsel iWlz
      cover_subtitle: pdf van Afsprakenstelsel iWlz https://istandaarden.github.io/Afsprakenstelsel-iWlz/
      cover_logo: docs/assets/ZinBanner.png
      copyright: "iStandaarden.nl"
      output_path: pdf/afsprakenstelsel-iWlz.pdf
      toc_title: Inhoudsopgave
      toc_level: 2
      # heading_shift: true
      # ordered_chapter_level: 2
      cover: true
      back_cover: false

# Custom CSS
extra_css:
  - css/zin.css
  - css/mermaid-zoom.css
  - css/print.css

# extra JavaScript
extra_javascript:
  - assets/javascripts/svg-pan-zoom.min.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js
#  - assets/javascripts/mermaid-panzoom.js
  - assets/javascripts/mermaid-zoom.js

extra:
  pdf_url: pdf/afsprakenstelsel-iWlz.pdf

# Markdown extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-zoom
          format: !!python/name:pymdownx.superfences.fence_code_format

