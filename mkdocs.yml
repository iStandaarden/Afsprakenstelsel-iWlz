site_name: Afsprakenstelsel iWlz Netwerkmodel
site_url: https://istandaarden.github.io/Afsprakenstelsel-iWlz/
repo_url: https://github.com/iStandaarden/Afsprakenstelsel-iWlz
repo_name: iStandaarden/Afsprakenstelsel-iWlz
theme:
  name: material
  language: nl
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: custom
      accent: deep orange

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
      primary: custom
      accent: deep purple

  features:
      - navigation.top
      - navigation.sections
      - navigation.instant
      - navigation.tracking
      - navigation.footer
      - search.highlight
      - search.suggest
      - content.code.annotate
      - content.code.copy
      - content.tabs.link
      - content.tooltips
      - toc.follow
extra_css:
  - css/zin.css
markdown_extensions: 
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Introductie: index.md
  - Inhoud:
      - Inleiding: 
          - Toelichting: afsprakenstelsel-iwlz-netwerkmodel/inleiding.md
          - Achtergrond & Toelichting: afsprakenstelsel-iwlz-netwerkmodel/achtergrond-toelichting.md
          - Governance: afsprakenstelsel-iwlz-netwerkmodel/governance.md
          - Begrippenlijst: afsprakenstelsel-iwlz-netwerkmodel/begrippenlijst.md
      - Organisatiebeleid:
          - Toelichting: afsprakenstelsel-iwlz-netwerkmodel/organisatiebeleid.md
      - Proces:
          - Toelichting: afsprakenstelsel-iwlz-netwerkmodel/proces.md
          - Netwerkfuncties: afsprakenstelsel-iwlz-netwerkmodel/proces/netwerkfuncties.md
      - Applicatie: 
          - Toelichting: applicatie.md
          - Applicatie-Componenten: afsprakenstelsel-iwlz-netwerkmodel/applicatie/applicatiecomponenten.md
          - Diensten: afsprakenstelsel-iwlz-netwerkmodel/applicatie/Diensten.md
      - Doel: afsprakenstelsel-iwzl-netwerkmodel/doel.md
      - Scope: afsprakenstelsel-iwzl-netwerkmodel/scope.md
      - Architectuur: afsprakenstelsel-iwzl-netwerkmodel/architectuur.md
      - Implementatie: afsprakenstelsel-iwzl-netwerkmodel/implementatie.md

